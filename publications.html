<html lang="en" data-theme="light">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<body data-page="publications">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <canvas class="flow-bg" data-flow data-flow-sparse aria-hidden="true"></canvas>
      <div class="container">
        <h1>Publications</h1>
        <p class="page-hero__lead">For the complete and up-to-date list of publications, please see my
          <a href="https://scholar.google.com/citations?user=BVE2X2sAAAAJ&hl=en" target="_blank" rel="noopener">Google Scholar</a> and
          <a href="https://www.researchgate.net/profile/Vaibhav-Tyagi-14" target="_blank" rel="noopener">ResearchGate</a> profiles.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="pub-controls">
          <div class="chips" id="pubFilters" role="group" aria-label="Filter publications"></div>
          <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="pubSearch" placeholder="Search title, venue, co-author…" aria-label="Search publications">
          </label>
        </div>
        <div id="pubGroups"></div>
        <p class="empty" id="pubEmpty" hidden>No echoes found. Try another search.</p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="viz.js"></script>
  <script src="site.js"></script>
