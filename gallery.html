<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Gallery — Dr. Vaibhav Tyagi</title>
  <meta name="description" content="Photos from conferences, awards, field work and the Ph.D. journey of Vaibhav Tyagi.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'><rect width='34' height='34' rx='9' fill='%23071520'/><circle cx='17' cy='17' r='11' fill='none' stroke='%232ee6d6' stroke-opacity='.5'/><path d='M17 17 L17 6 A11 11 0 0 1 26.5 11.5 Z' fill='%232ee6d6' fill-opacity='.6'/><circle cx='22.5' cy='12' r='2' fill='%23fdf802'/><circle cx='11.5' cy='21.5' r='1.7' fill='%23fd0000'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('vt-theme-v2') || 'light'; } catch (e) {}</script>
</head>
<body data-page="gallery">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <canvas class="flow-bg" data-flow data-flow-sparse aria-hidden="true"></canvas>
      <div class="container">
        <h1>Gallery</h1>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="chips" id="galleryFilters" role="group" aria-label="Filter photos" style="margin-bottom:24px"></div>
        <ul class="gallery" id="galleryGrid"></ul>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" data-lb="close" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" data-lb="prev" aria-label="Previous photo">‹</button>
    <figure class="lightbox__fig">
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" data-lb="next" aria-label="Next photo">›</button>
  </div>

  <footer id="site-footer" class="footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="viz.js"></script>
  <script src="site.js"></script>
</body>
</html>
